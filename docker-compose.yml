version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: asistencia-postgres
    environment:
      POSTGRES_DB: asistencia_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - asistencia-network

  app:
    build: .
    container_name: asistencia-app
    environment:
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - asistencia-network

volumes:
  postgres_data:

networks:
  asistencia-network:
    driver: bridge
